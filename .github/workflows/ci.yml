name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src/a_share_multifactor/run_contract.py tests/test_certified_execution.py tests/test_qf_parity.py

      - name: Pytest
        run: >-
          pytest -q --cov=src/a_share_multifactor --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Enforce certification branch coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          candidates = [
              (key, value) for key, value in report["files"].items()
              if key.replace("\\", "/").endswith("/a_share_multifactor/run_contract.py")
          ]
          if not candidates:
              raise SystemExit("certification core is missing from coverage JSON")
          summary = candidates[0][1]["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          if total == 0 or covered / total < 0.90:
              raise SystemExit(f"run_contract pure branch coverage is {covered}/{total}")
          print(f"run_contract pure branches: {covered}/{total}={covered / total:.2%}")
          PY
