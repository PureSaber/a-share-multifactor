[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-multifactor"
version = "0.4.2"
description = "A-share multi-factor stock selection research project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "akshare==1.18.88.post1",
    "mini-racer==0.14.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "quant-data-kit[akshare] @ git+https://github.com/PureSaber/quant-data-kit.git@8fed47b8f62694c36830dec270cfa21759133f2f",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@9aa58fd1263165c130c5ccb8b873bfc713c470cd",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@476d2014b2ac3de88d03a9e2009edf561a60eafa",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@c8d73813fe6a631a21811182804b3e3b857839d8",
]

[project.optional-dependencies]
dev = [
    "pip-tools==7.6.1",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]
notebook = [
    "jupyterlab>=4.0",
]

[project.scripts]
asm-fetch = "a_share_multifactor.fetch_data:main"
asm-backtest = "a_share_multifactor.backtest:main"
asm-grid-search = "a_share_multifactor.grid_search:main"
asm-compare = "a_share_multifactor.synthesis_compare:main"
asm-retail-grid = "a_share_multifactor.retail_param_grid:main"
asm-decision = "a_share_multifactor.decision_workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=src/a_share_multifactor --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["a_share_multifactor"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.quant-workspace]
layer = "strategy"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
