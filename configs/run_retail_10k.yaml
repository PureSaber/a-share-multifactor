# 散户模拟：1万元纯多头，2025 至今
# 含 100 股一手、佣金最低 5 元、卖出印花税 0.05%
universe: hs300
start_date: "2020-01-01"
end_date: "2026-07-08"

factors:
  - market_cap
  - pe_ratio
  - pb_ratio
  - momentum_20d
  - volatility_20d

factor_directions:
  market_cap: -1
  pe_ratio: -1
  pb_ratio: -1
  momentum_20d: 1
  volatility_20d: -1

quantiles: 5
rebalance_freq: monthly
holding_period: rebalance
forward_return_days: 20
outputs_dir: outputs

filters:
  use_historical_universe: false
  exclude_st: false
  min_list_days: 0
  pit_fundamentals: true
  fundamental_lag_days: 0

preprocess:
  winsorize: [0.01, 0.99]
  standardize: zscore
  neutralize: false

synthesis:
  method: equal_weight
  lookback_months: 12

ic_decay_horizons: [1, 5, 10, 20]

costs:
  commission: 0.0003
  slippage: 0.001
  retail_mode: true
  min_commission: 5.0
  stamp_tax: 0.0005
  lot_size: 100
  initial_capital: 10000
  max_holdings: 10
  partial_rebalance: true

fetch:
  max_workers: 1
  sleep_seconds: 0.3
  max_retries: 3

data:
  price: cn_a/daily/prices.parquet
  fundamentals: cn_a/fundamentals.parquet
  universe: cn_a/universe/hs300_membership.parquet
  benchmark: cn_a/benchmark/hs300_index.parquet
