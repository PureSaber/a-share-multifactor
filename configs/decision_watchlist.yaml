# Demonstration watchlist; not recommended securities or a historical index universe.
watchlist:
  - {symbol: "000001", venue: SZSE, name: 平安银行}
  - {symbol: "000333", venue: SZSE, name: 美的集团}
  - {symbol: "600036", venue: SSE, name: 招商银行}
  - {symbol: "601318", venue: SSE, name: 中国平安}
history_days: 730
# Start a forward virtual account at the first captured close. Subsequent runs
# advance its frozen signals and actual raw-price history in the same output dir.
simulation_sessions: 1
frequency: weekly
provider_timeout_seconds: 90
app:
  factors: [momentum_20d, volatility_20d]
  synthesis: {method: equal_weight}
  quantiles: 2
  forward_return_days: 5
  validation: {enabled: true, train_size: 126, test_size: 42, step_size: 42, embargo_size: 5}
  costs:
    retail_mode: false
    initial_capital: 100000
    commission: 0.0003
    min_commission: 5
    stamp_tax: 0.0005
    slippage: 0.001
    participation_rate: 0.01
    max_holdings: 2
    max_position_weight: 0.25
    cash_buffer: 0.05
risk:
  max_single_weight: 0.30
  max_drawdown: 0.15
