# 股票池与回测区间
universe: hs300
start_date: "2020-01-01"
end_date: "2024-12-31"

# 因子列表
factors:
  - market_cap
  - pe_ratio
  - pb_ratio
  - momentum_20d
  - volatility_20d

# 因子方向：+1 表示因子值越大得分越高，-1 表示反向（如小市值、低 PE）
factor_directions:
  market_cap: -1
  pe_ratio: -1
  pb_ratio: -1
  momentum_20d: 1
  reversal_5d: 1
  turnover_20d: -1
  volatility_20d: -1

# 分层回测
quantiles: 5
rebalance_freq: monthly
holding_period: rebalance  # rebalance | 使用 forward_return_days

# IC 前向收益窗口（交易日，与 holding_period 独立）
forward_return_days: 20

# 输出目录（相对于仓库根目录）
outputs_dir: outputs

# 股票池过滤
filters:
  use_historical_universe: true
  exclude_st: true
  min_list_days: 60
  pit_fundamentals: true
  fundamental_lag_days: 0
  fundamental_max_age_days: 550
  require_availability_timestamp: true

# 严格样本外验证：训练窗口、测试窗口和embargo均按交易日计
validation:
  enabled: true
  train_size: 504
  test_size: 126
  step_size: 126
  embargo_size: 20
  multiple_testing_alpha: 0.05

# 因子预处理
preprocess:
  winsorize: [0.01, 0.99]
  standardize: zscore
  neutralize: false
  neutralize_by: [industry]

# 因子合成
synthesis:
  method: equal_weight  # equal_weight | ic_weight | rolling_ic_weight | ridge | ols
  lookback_months: 12
  ridge_alpha: 1.0

# IC 衰减分析 horizons（交易日）
ic_decay_horizons: [1, 5, 10, 20]

# 参数扫描（grid_search CLI）
grid_search:
  quantiles: [3, 5, 10]
  winsorize_upper: [0.95, 0.99]

# 交易成本
costs:
  commission: 0.0003
  slippage: 0.001
  # 散户模拟（可选）
  # retail_mode: true
  # min_commission: 5.0
  # stamp_tax: 0.0005
  # lot_size: 100
  # initial_capital: 10000
  # max_holdings: 10
  # partial_rebalance: true

# 数据拉取
fetch:
  max_workers: 4
  sleep_seconds: 0.2
  max_retries: 3

# 数据路径（相对于仓库根目录 data/）
data:
  price: cn_a/daily/prices.parquet
  fundamentals: cn_a/fundamentals.parquet
  universe: cn_a/universe/hs300_membership.parquet
  benchmark: cn_a/benchmark/hs300_index.parquet
  snapshot_root: snapshots
